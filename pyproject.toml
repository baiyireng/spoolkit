[project]
name = "agents-dev"
version = "0.0.1"
description = "本地小模型编程特化 Agent：短上下文 + 外置记忆 + 代码索引"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = ["rich>=13.9"]
dev = [
    "pytest>=8.3",
]

[project.scripts]
agents-dev = "agents_dev.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

