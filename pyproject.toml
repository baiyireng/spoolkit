[project]
name = "spoolkit"
version = "0.0.1"
description = "本地小模型编程特化 Agent：短上下文 + 外置记忆 + 代码索引"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Aaron", email = "aaron_gb2022@outlook.com" }]
keywords = ["agent", "llm", "llama.cpp", "coding-assistant", "local-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/baiyireng/spoolkit"
Repository = "https://github.com/baiyireng/spoolkit"
Issues = "https://github.com/baiyireng/spoolkit/issues"
Documentation = "https://github.com/baiyireng/spoolkit/tree/main/docs"

[project.optional-dependencies]
dev = [
    # 版本写死：类型检查器的结论对版本敏感，基线（`tools/mypy-baseline.json`）
    # 会随它漂移。升级要当一次**批次**做（刷新基线、单独提交、看 diff）。
    "mypy==2.4.0",
    "pytest>=8.3",
]
# 通道走 SOCKS 代理时需要它（httpx 的 SOCKS 支持在可选的 socksio 里）。
# 不放进主依赖：默认直连的人不该为此多装一个包。
socks = ["httpx[socks]>=0.27"]

[project.scripts]
# `spool` 是手敲的那一个；`spoolkit` 是同义的稳妥写法（脚本里、文档里都行）；
# `agents-dev` 是改名前的旧名，留着免得别人已写好的脚本一朝失效。
spool = "spoolkit.cli.app:main"
spoolkit = "spoolkit.cli.app:main"
agents-dev = "spoolkit.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---- 类型检查（开发侧关口之一，见 scripts/gate.py）----------------------------
#
# 为什么是 mypy 而不是 pyright：**环境依赖最少**。pyright 是 Node 生态的
# （PyPI 那个包装包也要 Node，除非再加 `pyright[nodejs]` 拉 40MB 轮子），
# 而本仓是纯 Python：`uv sync` 一条命令、锁在 uv.lock 里，一个只有 Python 的
# 机器就能跑。同一份代码在多数开发者手里都能便利开发，是这一层的目的。
#
# 版本写死在 `[project.optional-dependencies].dev`：检查器的结论对版本敏感，
# 基线（`tools/mypy-baseline.json`）会随它漂移。升级要当一次**批次**做。
#
# 严格度**分阶段**推，不一步到位压死开发：
#   阶段 0：不要求注解，先把真错抓出来 + 基线棘轮（只对新错报红）；
#   阶段 1：`spoolkit.agent` 开严，见下面的 overrides。抓的是类型对不上。
# 不开 `disallow_untyped_defs` / `disallow_untyped_calls` / 全局 `strict`。
# 注解只加在复杂、有歧义、或有重要注意事项的函数上。简单函数不必为了
# 满足 mypy 的「每个函数都要注解」去补。不是严重、也不会引发严重后果的
# 类型提示，不在这上面花批次。
[tool.mypy]
files = ["src/spoolkit"]
# 取 `requires-python` 的下限：这样「用到了 3.13+ 才有的标准库/语义」会被抓出来，
# 而不是等到别人的 3.12 机器上才炸。想按本机版本跑就注释掉这一行。
python_version = "3.12"
show_error_codes = true
pretty = false
# 本仓依赖（httpx / rich）没带 py.typed 就先当成 Any：没有这一步会满屏
# 「跳过分析」，把真错淹掉。阶段 1 里逐条给出 stub 再说。
ignore_missing_imports = true
# 这几条都**不要求写注解**，但能抓出真问题：
#   check_untyped_defs —— 没注解的函数体也检查（最容易藏 bug 的地方）
#   possibly-undefined —— 可能未绑定的变量（mypy 默认只警告，不开就是漏）
#   warn_unused_ignores / warn_redundant_casts —— 让过期的 `# type: ignore` 自己暴露
check_untyped_defs = true
enable_error_code = ["possibly-undefined"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# 阶段 1：只对 agent 开严。这些开关抓的是「类型对不上」，不是「没写注解」。
[[tool.mypy.overrides]]
module = ["spoolkit.agent", "spoolkit.agent.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
