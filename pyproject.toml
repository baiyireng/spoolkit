[project]
name = "agents-dev"
version = "0.0.1"
description = "本地小模型编程特化 Agent：短上下文 + 外置记忆 + 代码索引"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Aaron", email = "aaron_gb2022@outlook.com" }]
keywords = ["agent", "llm", "llama.cpp", "coding-assistant", "local-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
# 通道走 SOCKS 代理时需要它（httpx 的 SOCKS 支持在可选的 socksio 里）。
# 不放进主依赖：默认直连的人不该为此多装一个包。
socks = ["httpx[socks]>=0.27"]

[project.scripts]
agents-dev = "agents_dev.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
